<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>나의 세종 리더십 유형 찾기</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');:root{--red:#a73338;--ink:#242321;--muted:#77736e;--bg:#f7f5f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif}main{max-width:520px;margin:auto;min-height:100dvh;background:#fff;padding:28px 22px 50px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--red)}h1{font-size:34px;letter-spacing:-1.7px;line-height:1.34;margin:16px 0}h2{font-size:24px;letter-spacing:-1px;line-height:1.45}p{line-height:1.85;color:#615e59}.hero{padding-top:48px}.nameinput{width:100%;padding:17px;border:1px solid #d9d0c7;border-radius:12px;font:inherit;font-size:17px;margin-top:12px}.result-art{width:100%;border-radius:14px;display:block;margin:18px 0;object-fit:cover;aspect-ratio:960/330}.seal{font-size:72px;margin:22px 0}button{font:inherit;cursor:pointer}button.primary{width:100%;border:0;border-radius:13px;background:var(--red);color:white;padding:17px;font-weight:800;font-size:16px;margin-top:20px}.secondary{width:100%;border:1px solid #ddd7d1;background:white;border-radius:12px;padding:14px;font-weight:700;margin-top:10px}.small{font-size:12px;color:#928b85}.progress{height:6px;background:#ece7e1;border-radius:9px;overflow:hidden;margin:18px 0 36px}.progress>div{height:100%;background:var(--red);transition:width .2s}.choice{width:100%;display:block;text-align:left;border:1px solid #e7e1da;background:#fff;border-radius:13px;padding:17px;margin:12px 0;line-height:1.65;font-size:15px}.choice:hover,.choice:focus{border-color:var(--red);background:#fff9f8}.number{color:var(--red);font-weight:800;font-size:13px}.result-card{background:#fcfaf6;border:1px solid #eae0d7;border-radius:18px;padding:25px 20px;margin:24px 0}.barrow{display:flex;align-items:center;gap:10px;margin:13px 0}.barrow span{width:54px;font-size:13px}.track{height:10px;flex:1;background:#e9e2d9;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--red);border-radius:10px}.barrow strong{width:38px;text-align:right;font-size:13px}.insight{border-top:1px solid #e7dfd7;padding-top:16px;margin-top:18px}.insight b{color:var(--red)}.foot{text-align:center;font-size:11px;color:#999;margin-top:30px}.hidden{display:none}#saveCanvas{display:none}#preview{width:100%;border-radius:12px;margin-top:16px;border:1px solid #eee}a.download{display:block;text-align:center;text-decoration:none;background:var(--red);color:#fff;padding:16px;border-radius:12px;font-weight:800;margin-top:14px}</style></head><body><main id="app"></main><canvas id="saveCanvas" width="1080" height="1280"></canvas><script>
const types={A:{name:'경청형',subtitle:'사람의 목소리에서 답을 찾는 리더',strength:'다양한 의견을 듣고 구성원의 신뢰와 참여를 이끌어냅니다.',caution:'의견을 모두 수용하려다 결정이 늦어질 수 있습니다.',lesson:'세종의 경청은 단순한 동의가 아니었습니다. 서로 다른 주장을 검토한 뒤 판단하는 과정이었습니다.',question:'나는 지금 누구의 목소리를 충분히 듣지 못하고 있는가?',action:'다음 회의에서 평소 말이 적은 동료에게 먼저 의견을 물어보세요.'},B:{name:'성장형',subtitle:'사람의 가능성을 발견하는 리더',strength:'구성원의 강점을 발견하고 역량을 발휘할 기회를 만듭니다.',caution:'성장을 기다리는 동안 당장의 성과와 책임을 놓칠 수 있습니다.',lesson:'세종은 인재를 알아보고 배움과 연구의 기회를 마련했습니다. 사람을 키우는 일은 장기적인 조직 역량을 만드는 일입니다.',question:'내가 아직 발견하지 못한 동료의 강점은 무엇인가?',action:'이번 주 동료 한 명에게 구체적인 강점과 새로운 도전 기회를 이야기해 보세요.'},C:{name:'판단형',subtitle:'근거와 기준으로 방향을 정하는 리더',strength:'복잡한 상황에서도 목표와 근거를 확인하며 책임 있게 결정합니다.',caution:'논리와 원칙에 집중하다 구성원의 감정이나 현장 맥락을 놓칠 수 있습니다.',lesson:'세종은 논의를 거듭하면서도 중요한 국정의 최종 판단을 책임졌습니다. 좋은 결정에는 근거뿐 아니라 실행의 책임도 따릅니다.',question:'내 결정의 기준은 구성원에게 충분히 설명되어 있는가?',action:'이번 주 중요한 결정 하나에 대해 판단 기준을 한 문장으로 공유해 보세요.'},D:{name:'혁신형',subtitle:'익숙한 한계를 넘어 길을 만드는 리더',strength:'문제의 본질을 다시 묻고 새로운 해결 방식을 시도합니다.',caution:'변화의 속도가 빨라 구성원의 이해와 준비를 앞지를 수 있습니다.',lesson:'훈민정음 창제와 과학기술 진흥은 기존 방식의 한계를 살피고 새로운 도구를 만든 사례입니다. 혁신은 사람의 실제 문제에서 출발해야 합니다.',question:'우리가 당연하게 여기는 방식 중 다시 물어야 할 것은 무엇인가?',action:'반복되는 업무 하나를 골라 더 단순하게 바꿀 수 있는 실험을 제안해 보세요.'}};
const questions=[
['회의에서 팀원들의 의견이 충돌했습니다. 어떻게 하겠습니까?',['각자의 말을 충분히 듣고 쟁점을 정리한다.','각자의 강점을 살려 역할을 새롭게 나눈다.','목표와 근거를 비교해 결정한다.','기존 선택지 밖의 해결책을 찾아본다.']],
['새로운 직원이 업무에 적응하지 못하고 있습니다.',['어려운 점이 무엇인지 먼저 이야기를 듣는다.','작은 성공 경험을 만들도록 단계별로 돕는다.','필요한 업무 기준과 우선순위를 명확히 한다.','업무를 배우는 방식을 새롭게 설계한다.']],
['중요한 사업의 성과가 기대에 못 미쳤습니다.',['현장 담당자들의 의견부터 모은다.','팀원들의 역량을 점검하고 지원책을 마련한다.','성과 자료를 분석해 원인을 판단한다.','사업 방식 자체를 바꿀 가능성을 검토한다.']],
['급하게 결정을 내려야 하는 상황입니다.',['관련된 사람들의 핵심 우려를 짧게 확인한다.','실행할 사람의 역량과 준비 상태를 확인한다.','핵심 근거와 위험을 확인하고 결정한다.','작게 시험할 수 있는 대안을 신속히 만든다.']],
['팀원이 실수를 보고했습니다.',['무슨 일이 있었는지 차분하게 듣는다.','다음에는 잘할 수 있도록 피드백한다.','원인과 책임, 재발 방지 기준을 정한다.','실수가 반복되지 않을 새 시스템을 고민한다.']],
['새로운 정책을 추진하라는 요청을 받았습니다.',['영향을 받을 사람들의 의견을 수렴한다.','담당자의 역량과 협업 체계를 먼저 준비한다.','정책의 목적과 실행 기준을 분명히 한다.','기존 절차를 개선할 방법을 실험한다.']],
['팀원들에게 업무를 배분해야 합니다.',['희망과 부담을 먼저 물어본다.','각자의 잠재력과 성장 기회를 고려한다.','역할과 책임, 마감 기준을 명확히 한다.','기존 분장 방식과 다른 조합을 시도한다.']],
['조직에 오래된 비효율적인 관행이 있습니다.',['왜 유지됐는지 관계자들의 이야기를 듣는다.','변화를 이끌 내부 인재를 키운다.','관행의 비용과 개선 효과를 비교한다.','작은 실험으로 새로운 방식을 검증한다.']],
['상사가 현장과 맞지 않는 지시를 내렸습니다.',['상사의 의도와 현장의 우려를 함께 듣는다.','현장 구성원과 함께 대응 역량을 모은다.','사실과 근거를 정리해 수정안을 제시한다.','목표는 유지하되 다른 실행 방법을 제안한다.']],
['팀의 분위기가 침체되어 있습니다.',['구성원들의 속마음을 들을 자리를 만든다.','서로의 장점을 인정하고 성장 기회를 준다.','문제와 목표를 명확히 해 혼란을 줄인다.','새로운 협업 활동을 시도해 활력을 만든다.']],
['좋은 아이디어가 나왔지만 반대가 많습니다.',['반대 이유를 듣고 우려를 정리한다.','아이디어를 실현할 사람을 모아 지원한다.','실행 근거와 위험을 검증한다.','작은 시범사업으로 가능성을 보여준다.']],
['당신이 생각하는 좋은 리더의 첫 번째 역할은?',['사람들의 목소리를 놓치지 않는 것.','사람이 성장할 기회를 만드는 것.','명확한 기준으로 책임 있게 결정하는 것.','더 나은 미래를 위한 변화를 만드는 것.']]
];
let participantName='',index=-1,answers=[];const app=document.getElementById('app');function start(){const input=document.getElementById('participantName');if(input){participantName=input.value.trim().slice(0,20);if(!participantName){input.focus();alert('이름을 입력해 주세요.');return}}index=0;answers=[];render()}function render(){if(index<0){app.innerHTML=`<section class="hero"><div class="eyebrow">SEJONG LEADERSHIP TEST</div><div class="seal">♛</div><h1>나는 어떤<br><span style="color:var(--red)">세종 리더십</span> 유형일까?</h1><p>조직에서 마주하는 12가지 상황.<br>당신이 가장 자연스럽게 선택하는 행동을 골라보세요.</p><label for="participantName" style="font-weight:700">이름을 입력해 주세요</label><input id="participantName" class="nameinput" maxlength="20" placeholder="예: 홍길동" autocomplete="name"><button class="primary" onclick="start()">나의 유형 알아보기 →</button><p class="small">약 3~5분 · 12문항 · 회원가입 없음<br>교육용 자기성찰 도구이며 표준화된 심리검사가 아닙니다.</p></section>`;return}if(index>=questions.length){result();return}const q=questions[index];app.innerHTML=`<div class="eyebrow">SEJONG LEADERSHIP TEST</div><div class="progress"><div style="width:${index/12*100}%"></div></div><div class="number">QUESTION ${String(index+1).padStart(2,'0')} / 12</div><h2>${q[0]}</h2><p>평소 나의 행동과 가장 가까운 답을 선택해 주세요.</p>${q[1].map((s,i)=>`<button class="choice" onclick="choose(${i})">${s}</button>`).join('')}${index?'<button class="secondary" onclick="back()">← 이전 문항</button>':''}`};function choose(i){answers[index]=i;index++;render()}function back(){index--;render()};let resultData;
function escapeHTML(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function result(){let counts=[0,0,0,0];answers.forEach(a=>counts[a]++);let max=Math.max(...counts);let winner=counts.indexOf(max);let keys=['A','B','C','D'];let t=types[keys[winner]];resultData={counts,winner,t};let bars=counts.map((n,i)=>`<div class="barrow"><span>${types[keys[i]].name}</span><div class="track"><div class="fill" style="width:${n/12*100}%"></div></div><strong>${n}/12</strong></div>`).join('');app.innerHTML=`<div class="eyebrow">YOUR LEADERSHIP RESULT</div><h1>${escapeHTML(participantName)}님의 리더십은<br><span style="color:var(--red)">${t.name}</span>입니다.</h1><p>${t.subtitle}</p><div class="result-card"><div class="eyebrow">나의 유형 분포</div>${bars}<div class="insight"><b>나의 강점</b><p>${t.strength}</p></div><div class="insight"><b>주의할 점</b><p>${t.caution}</p></div><div class="insight"><b>세종에게 배우는 리더십</b><p>${t.lesson}</p></div><div class="insight"><b>오늘 나에게 던지는 질문</b><p style="font-weight:800;color:#242321">“${t.question}”</p></div><div class="insight"><b>이번 주 작은 실천</b><p>${t.action}</p></div></div><button class="primary" onclick="makeImage()">결과 이미지 만들기 · 저장하기</button><button class="secondary" onclick="index=-1;participantName='';render()">처음부터 다시 진단하기</button><p class="foot">세종의 통치에서 착안한 교육용 유형 분류입니다.<br>동점일 경우 문항 선택 순서와 유형 순서에 따라 대표 유형을 표시합니다.</p><p class="foot">원작자 : 배하연 · <a href="https://litt.ly/hayeon1446" target="_blank" rel="noopener noreferrer" style="color:#a73338;text-decoration:underline;font-weight:700">litt.ly/hayeon1446</a></p><div id="imageArea"></div>`}
async function makeImage(){try{await document.fonts.ready}catch(e){}const c=document.getElementById('saveCanvas'),ctx=c.getContext('2d');const {counts,t}=resultData;ctx.fillStyle='#fbf8f3';ctx.fillRect(0,0,1080,1280);ctx.fillStyle='#a73338';ctx.fillRect(0,0,1080,20);ctx.textBaseline='top';ctx.fillStyle='#a73338';ctx.font='bold 34px "Noto Sans KR",sans-serif';ctx.fillText('SEJONG LEADERSHIP TEST',75,65);ctx.fillStyle='#292725';ctx.font='bold 70px "Noto Sans KR",sans-serif';ctx.font='bold 57px "Noto Sans KR",sans-serif';ctx.fillText(participantName+'님의 리더십은',75,123);ctx.fillStyle='#a73338';ctx.font='bold 96px "Noto Sans KR",sans-serif';ctx.fillText(t.name+'입니다',75,205);ctx.fillStyle='#5f5a55';ctx.font='34px "Noto Sans KR",sans-serif';ctx.fillText(t.subtitle,75,325);ctx.strokeStyle='#e2d8ce';ctx.beginPath();ctx.moveTo(75,395);ctx.lineTo(1005,395);ctx.stroke();const labels=['경청형','성장형','판단형','혁신형'];counts.forEach((n,i)=>{let y=450+i*70;ctx.fillStyle='#34312e';ctx.font='bold 29px "Noto Sans KR",sans-serif';ctx.fillText(labels[i],75,y);ctx.fillStyle='#e9e2db';ctx.fillRect(225,y+7,660,24);ctx.fillStyle='#a73338';ctx.fillRect(225,y+7,660*n/12,24);ctx.fillStyle='#34312e';ctx.fillText(n+'/12',915,y)});function wrap(text,x,y,maxWidth,lineHeight,maxLines=3){let line='',lines=0;for(const char of text){if(ctx.measureText(line+char).width>maxWidth){ctx.fillText(line,x,y+lines*lineHeight);line=char;lines++;if(lines>=maxLines)return y+(lines+1)*lineHeight}else line+=char}ctx.fillText(line,x,y+lines*lineHeight);return y+(lines+1)*lineHeight}let y=780;function block(label,value){ctx.fillStyle='#a73338';ctx.font='bold 29px "Noto Sans KR",sans-serif';ctx.fillText(label,75,y);y+=48;ctx.fillStyle='#34312e';ctx.font='29px "Noto Sans KR",sans-serif';y=wrap(value,75,y,925,45,3)+34}block('나의 강점',t.strength);block('성장을 위한 질문','“'+t.question+'”');ctx.fillStyle='#93877d';ctx.font='25px "Noto Sans KR",sans-serif';ctx.fillText('원작자 : 배하연  |  litt.ly/hayeon1446',75,1230);const url=c.toDataURL('image/png');document.getElementById('imageArea').innerHTML=`<img id="preview" alt="저장할 결과 이미지" src="${url}"><a class="download" download="${escapeHTML(participantName)}_세종_리더십_${t.name}.png" href="${url}">PNG 이미지 저장하기 ↓</a><p class="small">휴대전화에서 저장 버튼을 누르거나 이미지를 길게 눌러 저장할 수 있습니다.</p>`;document.getElementById('imageArea').scrollIntoView({behavior:'smooth'})}render();</script></body></html>
