<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세종이라면, 나는 어떤 리더일까?</title>
<meta name="description" content="나의 소통 습관을 발견하고, 내일 바꿀 행동 하나 찾기. 10개의 업무 상황으로 살펴보는 교육용 자기성찰 활동입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="세종이라면, 나는 어떤 리더일까?">
<meta property="og:description" content="나의 소통 습관을 발견하고, 내일 바꿀 행동 하나 찾기 · 10문항 · 약 5–7분">
<meta property="og:url" content="https://sejong-book.vercel.app/sejong">
<meta property="og:image" content="https://sejong-book.vercel.app/cover.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#FAF8F3;--card:#fff;--red:#8F2525;--red-bg:#F6ECEA;--ink:#202020;--muted:#666;--line:#E6E0D6;--font:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:560px;margin:0 auto;min-height:100dvh;padding:28px 18px 56px}
button{font:inherit;cursor:pointer;color:inherit}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--red)}
h1{font-size:clamp(26px,7vw,34px);line-height:1.3;letter-spacing:-.03em;margin:14px 0 10px}
h2{font-size:clamp(20px,5.4vw,23px);line-height:1.45;letter-spacing:-.02em;margin:6px 0 8px}
.ask-line{font-size:15.5px;color:#333;margin:0 0 16px}
.ask-line b{color:var(--red);font-weight:800}
p{margin:0}
.lead{font-size:17px;color:var(--ink);font-weight:600;margin-bottom:18px}
.guide{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;font-size:15.5px;color:#333}
.guide b{color:var(--red)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.meta span{font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--red);color:#fff;font-size:17px;font-weight:700;padding:14px;margin-top:22px}
.btn:disabled{background:#cfc6c3;cursor:default}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600;margin-top:10px}
.notice{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.7}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.top strong{color:var(--red);font-size:15px}
.bar{height:6px;background:#EAE3D8;border-radius:9px;overflow:hidden;margin:10px 0 26px}
.bar>div{height:100%;background:var(--red);transition:width .25s}
.choice{display:block;width:100%;min-height:56px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;margin:10px 0;font-size:16px;line-height:1.55}
.choice[aria-pressed="true"]{border-color:var(--red);background:var(--red-bg);font-weight:600}
.choice .k{display:inline-block;width:22px;color:var(--muted);font-weight:700}
.nav{display:flex;gap:10px;margin-top:18px}
.nav .btn{margin-top:0}
.nav .prev{flex:0 0 32%}
.result-head{margin:10px 0 6px}
.result-head h1 span{color:var(--red)}
.sub{font-size:14.5px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;margin:20px 0}
.card .tname{font-size:13px;font-weight:700;color:var(--red);letter-spacing:.04em}
.card .headline{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px;line-height:1.4}
.item{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.item b{display:block;font-size:13.5px;color:var(--red);margin-bottom:4px}
.item p{font-size:15.5px;color:#333}
.say{font-size:17px!important;font-weight:700;color:var(--ink)!important}
.src{display:block;font-size:12.5px;color:var(--muted);margin-top:6px}
.src a{color:var(--muted)}
.mix{background:var(--red-bg);border-radius:14px;padding:14px 16px;font-size:15px;margin-top:14px}
.dist{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.dist-title{font-size:14px;font-weight:700;margin-bottom:4px}
.dist-title span{font-weight:400;color:var(--muted);font-size:12.5px}
.drow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px}
.drow .dn{flex:0 0 132px;color:#333}
.drow .dt{flex:1;height:10px;background:#EFE9E0;border-radius:9px;overflow:hidden}
.drow .dt div{height:100%;background:#BFB3A8;border-radius:9px}
.drow .dc{flex:0 0 34px;text-align:right;color:var(--muted)}
.drow.on .dn,.drow.on .dc{color:var(--red);font-weight:700}
.drow.on .dt div{background:var(--red)}
.namefield{display:block;margin-top:20px;font-weight:700;font-size:15px}
.namefield input{display:block;width:100%;min-height:54px;margin-top:8px;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;font:inherit;font-size:17px;font-weight:400;background:#fff;color:var(--ink)}
.namefield input:focus{outline:none;border-color:var(--red)}
.nameerr{color:var(--red);font-size:13.5px;margin-top:6px;min-height:1em}
#imageArea img{width:100%;border-radius:12px;border:1px solid var(--line);margin-top:16px;display:block}
.small{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#202020;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.foot{text-align:center;font-size:12px;color:#999;margin-top:28px;line-height:1.8}
.foot a{color:var(--red);font-weight:600}
canvas{display:none}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<canvas id="cv" width="1080" height="1350"></canvas>
<script>
const TYPES=['Q','L','S','T'];
const P={
 Q:{name:'질문하는 탐구형',headline:'질문으로 길을 여는 리더',
  strength:'결론을 서두르기보다 먼저 사실과 다른 의견을 확인합니다. 복잡한 문제의 원인을 발견하는 데 도움이 됩니다.',
  when:'신규 정책의 타당성과 위험을 검토할 때',
  caution:'확인을 많이 하다가 책임 있는 결정을 늦출 수 있습니다. 질문만 이어가다 결정을 미루지 않도록 해 보세요.',
  sejong:'세종은 즉위 직후 인사 문제를 혼자 정하지 않고 함께 의논하겠다고 말했고, 이후 여러 기록에서 신하들에게 의견을 물었습니다.',
  src:'《세종실록》 세종 즉위년 8월 12일',link:'',
  say:'“결론을 내리기 전에, 우리가 놓친 사실은 무엇인가요?”',
  ask:'“제가 질문을 잘하는 때와, 질문만 늘어지는 때는 언제일까요?”'},
 L:{name:'듣고 조율하는 경청형',headline:'사람의 말을 끝까지 듣는 리더',
  strength:'상대의 의도와 걱정을 살피며 의견 차이를 조율합니다. 의견을 꺼내기 편한 관계를 만드는 데 도움이 됩니다.',
  when:'부서 간 협력, 또는 민원·갈등 상황에서',
  caution:'모두의 기분을 배려하느라 결정 기준을 모호하게 만들 수 있습니다. 갈등이 두려워 쟁점을 흐리지 않도록 해 보세요.',
  sejong:'세종이 집현전 학자들과 경연에서 묻고 토론한 장면들은, 듣기와 의논이 왜 리더의 일인지 돌아보게 합니다.',
  src:'강의 중 집현전·경연 부분과 연결한 현대적 해석입니다',link:'',
  say:'“제가 이해한 게 맞는지 먼저 확인해도 될까요?”',
  ask:'“잘 듣는 것과 무조건 동의하는 것은 어떻게 다를까요?”'},
 S:{name:'반대를 열어두는 직언환영형',headline:'불편한 말도 듣는 리더',
  strength:'반대 의견과 문제 제기를 배제하지 않습니다. 구성원이 숨기기 쉬운 위험을 드러낼 기회를 만듭니다.',
  when:'보고 누락, 정책 위험, 실수나 문제를 발견했을 때',
  caution:'의견을 자유롭게 말할 수 있게 하되, 반대를 듣는 데서 끝내지 말고 판단과 후속 조치, 책임과 실행 기준도 함께 세워야 합니다.',
  sejong:'하위지가 과거시험 답안에서 흥천사 공사를 비판하자, 세종은 과거시험이 바로 직언을 구하는 자리라고 평가했습니다. 다만 공사가 잘못됐다는 의견에 동의한 것은 아닙니다.',
  src:'《세종실록》 세종 20년 4월 12일',link:'https://sillok.history.go.kr/id/kda_12004012_002',
  say:'“제 생각과 다른 의견이 있다면 먼저 듣겠습니다.”',
  ask:'“우리 팀은 반대 의견을 낸 뒤에도 다음에 다시 말할 수 있을까요?”'},
 T:{name:'강점을 살리는 인재발견형',headline:'사람의 쓰임을 발견하는 리더',
  strength:'구성원에게 필요한 역할과 그 사람이 발휘할 수 있는 강점을 연결하려 합니다. 성과를 구체적으로 인정하는 데 도움이 됩니다.',
  when:'업무 분장, 협업 팀 구성, 성장 피드백을 할 때',
  caution:'첫인상으로 사람을 유형화하지 말고, 실제 능력과 직무 요구, 공정한 기회를 함께 봐야 합니다.',
  sejong:'세종 5년 사헌부는 사람을 쓰는 일을 목수가 나무를 쓰는 일에 비유했습니다. 이는 세종 자신의 직접 발언이 아니라 사헌부의 상소입니다.',
  src:'《세종실록》 세종 5년 5월 17일',link:'https://sillok.history.go.kr/id/kda_10505017_003',
  say:'“이 일을 할 때 어떤 강점을 가장 잘 발휘할 수 있으세요?”',
  ask:'“우리가 아직 충분히 발견하지 못한 동료의 강점은 무엇일까요?”'}
};
const QS=[
 ['회의에서 부서 사업 방향을 결정해야 합니다.',[['Q','먼저 확인해야 할 사실과 쟁점을 질문한다.'],['L','참석자들의 걱정과 기대를 충분히 듣는다.'],['S','반대 의견이나 놓친 위험이 있는지 요청한다.'],['T','누가 어떤 역할을 맡을 때 잘할지 살핀다.']]],
 ['직원이 ‘이 방식은 문제가 있을 것 같습니다’라고 말합니다.',[['S','어떤 문제가 걱정되는지, 편하게 말해달라고 한다.'],['T','해당 문제를 잘 검토할 사람과 함께 살펴보자고 한다.'],['Q','판단의 근거와 추가 확인 사항을 묻는다.'],['L','그 말을 꺼내기까지의 고민을 먼저 들어본다.']]],
 ['새로 온 직원이 업무를 어려워합니다.',[['L','어떤 점이 부담스러운지 이야기를 듣는다.'],['Q','무엇을 알고 무엇이 헷갈리는지 질문한다.'],['T','잘하는 일과 익숙하지 않은 일을 파악해 역할을 조정한다.'],['S','모르겠다고 말해도 괜찮다고 먼저 알려준다.']]],
 ['내가 추진한 업무에서 예상하지 못한 오류가 발견됩니다.',[['T','관련자의 역할과 지원 자원을 재배치한다.'],['S','오류를 조기에 알려준 행동을 인정한다.'],['L','관련자들의 상황과 어려움을 차분히 듣는다.'],['Q','오류가 생긴 과정과 재발 방지 원인을 확인한다.']]],
 ['부서 간 협의가 교착 상태입니다.',[['Q','서로 다른 판단의 기준부터 확인한다.'],['S','말하지 못한 반대 이유가 있는지 묻는다.'],['T','서로 잘할 수 있는 일을 나누어 맡긴다.'],['L','각 부서의 입장을 요약해 공통점을 찾는다.']]],
 ['직원이 좋은 성과를 냈습니다.',[['T','그 직원이 발휘한 구체적인 강점과 행동을 인정한다.'],['L','과정에서 어떤 점이 힘들었는지 이야기를 듣는다.'],['Q','무엇이 성공에 가장 크게 기여했는지 질문한다.'],['S','과정 중 제기했던 문제와 개선 의견도 함께 칭찬한다.']]],
 ['상급자의 지시가 현장 상황과 맞지 않는 것 같습니다.',[['S','우려와 근거를 정리해 필요한 이견을 전달한다.'],['Q','지시의 목표와 전제가 무엇인지 먼저 확인한다.'],['L','상급자와 실무자 각각의 입장을 이해하려 한다.'],['T','주어진 여건에서 적합한 담당자와 대응 역할을 검토한다.']]],
 ['팀원이 같은 실수를 반복합니다.',[['L','실수를 반복하는 데 어떤 어려움이 있는지 듣는다.'],['T','현재 역할과 역량·지원 방식이 맞는지 살핀다.'],['S','실수를 숨기지 않고 공유할 수 있는 방법을 만든다.'],['Q','실수의 원인과 업무 절차의 빈틈을 함께 확인한다.']]],
 ['기한이 촉박한 중요한 과제를 맡았습니다.',[['T','각자의 강점과 가용 시간을 고려해 역할을 나눈다.'],['Q','꼭 지켜야 할 우선순위와 성공 기준을 확인한다.'],['L','구성원이 감당할 수 있는 업무량과 우려를 듣는다.'],['S','일정상 위험 요소를 숨기지 말고 즉시 알리게 한다.']]],
 ['팀 회의에서 누구도 질문하지 않습니다.',[['S','반대나 모르는 점을 말해도 괜찮다고 먼저 밝힌다.'],['L','돌아가며 부담 없이 이야기할 시간을 만든다.'],['T','각자의 전문성과 강점을 살려 발언 기회를 준다.'],['Q','답하기 쉬운 구체적인 질문으로 대화를 연다.']]]
];
const N=QS.length;
let idx=-1, sel=new Array(N).fill(null), res=null, who='';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toTop(){window.scrollTo({top:0,behavior:'auto'})}

function score(s){
  if(!Array.isArray(s)||s.length!==N||!s.every(a=>Number.isInteger(a)&&a>=0&&a<=3)) return null;
  const sc={Q:0,L:0,S:0,T:0};
  s.forEach((c,i)=>{sc[QS[i][1][c][0]]+=1});
  const max=Math.max(...TYPES.map(t=>sc[t]));
  const tops=TYPES.filter(t=>sc[t]===max);
  return {scores:sc,topTypes:tops,mixed:tops.length>1};
}

function intro(){
  app.innerHTML=`<section>
  <div class="eyebrow">SEJONG LEADERSHIP</div>
  <h1>세종이라면,<br>나는 어떤 리더일까?</h1>
  <p class="lead">나의 소통 습관을 발견하고, 내일 바꿀 행동 하나 찾기</p>
  <div class="guide">세종의 리더십을 배운 지금, 나의 소통 습관도 살펴봅니다.<br><br>10개의 짧은 업무 상황을 읽고, <b>내가 실제로 가장 먼저 할 법한 행동</b>을 골라주세요. 정답도, 더 높은 유형도 없습니다.</div>
  <div class="meta"><span>10문항</span><span>약 5–7분</span><span>로그인 없음</span></div>
  <label class="namefield" for="who">이름을 입력해 주세요
    <input id="who" maxlength="12" placeholder="예: 홍길동" autocomplete="off" value="${esc(who)}" onkeydown="if(event.key==='Enter')begin()">
  </label>
  <p class="nameerr" id="nameerr" role="alert"></p>
  <button class="btn" style="margin-top:8px" onclick="begin()">내 리더십 살펴보기 →</button>
  <p class="notice">교육용 자기성찰 도구입니다. 성격이나 역량을 진단하는 검증된 심리검사는 아닙니다. 응답은 이 휴대폰 화면 안에서만 계산되며 어디에도 저장·전송되지 않습니다.</p>
  </section>`;
}

function question(){
  const [q,opts]=QS[idx], cur=sel[idx], last=idx===N-1;
  app.innerHTML=`<section>
  <div class="top"><span>상황 ${idx+1}</span><strong>${idx+1} / ${N}</strong></div>
  <div class="bar"><div style="width:${(idx+1)/N*100}%"></div></div>
  <h2>${esc(q)}</h2>
  <p class="ask-line">내가 실제로 <b>가장 먼저 할 법한 행동</b>을 골라주세요.</p>
  <div role="group" aria-label="선택지">
  ${opts.map((o,i)=>`<button class="choice" aria-pressed="${cur===i}" onclick="pick(${i})"><span class="k">${'ABCD'[i]}</span>${esc(o[1])}</button>`).join('')}
  </div>
  <div class="nav">
    <button class="btn line prev" onclick="go(${idx-1})">← 이전</button>
    <button class="btn" id="next" ${cur===null?'disabled':''} onclick="next()">${last?'결과 보기':'다음 →'}</button>
  </div>
  </section>`;
}

function begin(){
  const v=document.getElementById('who').value.trim().slice(0,12);
  if(!v){document.getElementById('nameerr').textContent='이름을 입력해 주세요.';document.getElementById('who').focus();return}
  who=v; go(0);
}
function pick(i){
  sel[idx]=i;
  document.querySelectorAll('.choice').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
  document.getElementById('next').disabled=false;
}
function next(){
  if(sel[idx]===null) return;
  if(idx<N-1){go(idx+1);return}
  const firstMissing=sel.findIndex(v=>v===null);
  if(firstMissing>=0){go(firstMissing);return}
  res=score(sel); if(!res){go(0);return}
  result(); toTop();
}
function go(i){ idx=i; if(idx<0){intro()}else{question()} toTop(); }

function typeCard(t){
  const p=P[t];
  return `<div class="card">
   <div class="tname">${p.name}</div>
   <div class="headline">${p.headline}</div>
   <div class="item"><b>내가 잘하는 방식</b><p>${p.strength}</p></div>
   <div class="item"><b>이런 상황에서 도움이 됩니다</b><p>${p.when}</p></div>
   <div class="item"><b>이럴 때는 다른 방식도 필요합니다</b><p>${p.caution}</p></div>
   <div class="item"><b>세종에게서 배우기</b><p>${p.sejong}</p><span class="src">출처: ${p.link?`<a href="${p.link}" target="_blank" rel="noopener noreferrer">${p.src}</a>`:p.src}</span></div>
   <div class="item"><b>내일부터 바꿀 말 한마디</b><p class="say">${p.say}</p></div>
  </div>`;
}

function result(){
  const {scores,topTypes,mixed}=res;
  const names=topTypes.map(t=>P[t].name);
  const W=esc(who);
  const head=mixed
    ? `<h1>${W}님에게는 두 가지 이상의<br><span>익숙한 방식</span>이 있습니다</h1><p class="sub">${names.join(' · ')}</p>`
    : `<h1>${W}님의 익숙한 리더십 방식은<br><span>${names[0]}</span></h1>`;
  const others=mixed
    ? `<div class="mix">여러 방식을 비슷하게 쓰고 있습니다. 어느 쪽이 더 낫다는 뜻이 아니라, 상황에 따라 자연스럽게 꺼내는 방식이 둘 이상이라는 뜻입니다.</div>`
    : `<div class="mix">나머지 세 가지 방식도 상황에 따라 도움이 됩니다. 조원들의 결과에서 내가 덜 쓰는 방식을 살펴보세요.</div>`;
  app.innerHTML=`<section>
  <div class="eyebrow">MY LEADERSHIP</div>
  <div class="result-head">${head}</div>
  <p class="sub">이 유형이 더 우수하다는 뜻이 아니라, 지금 상황에서 내가 자주 선택하는 행동 방식입니다.</p>
  ${others}
  <div class="dist" aria-label="10문항 중 각 방식을 고른 횟수">
    <p class="dist-title">10문항 중 각 방식을 고른 횟수 <span>· 순위가 아니에요</span></p>
    ${TYPES.map(t=>`<div class="drow${topTypes.includes(t)?' on':''}"><span class="dn">${P[t].name}</span><span class="dt"><div style="width:${scores[t]/N*100}%"></div></span><span class="dc">${scores[t]}번</span></div>`).join('')}
  </div>
  ${topTypes.map(typeCard).join('')}
  <button class="btn" onclick="makeImage()">결과 이미지 저장</button>
  <button class="btn line" onclick="copyText()">텍스트 복사</button>
  <button class="btn line" onclick="restart()">다시 해보기</button>
  <div id="imageArea"></div>
  <p class="foot">교육용 자기성찰 활동입니다. 검증된 심리검사나 평가 도구가 아니며,<br>상사·동료 평가에 사용하지 않습니다.<br>만든 사람 : 배하연 · <a href="https://litt.ly/hayeon1446" target="_blank" rel="noopener noreferrer">litt.ly/hayeon1446</a></p>
  </section>`;
}

function restart(){ sel=new Array(N).fill(null); res=null; go(-1); }

function resultText(){
  const {scores,topTypes,mixed}=res;
  let s='[세종이라면, 나는 어떤 리더일까?]\n';
  s+=mixed?`${who}님에게는 두 가지 이상의 익숙한 방식이 있습니다: ${topTypes.map(t=>P[t].name).join(' · ')}\n`:`${who}님의 익숙한 리더십 방식은 ${P[topTypes[0]].name}\n`;
  s+=`10문항 중 고른 횟수(순위 아님): ${TYPES.map(t=>P[t].name+' '+scores[t]+'번').join(' / ')}\n`;
  topTypes.forEach(t=>{const p=P[t];s+=`\n■ ${p.name} — ${p.headline}\n· 잘하는 방식: ${p.strength}\n· 도움이 되는 상황: ${p.when}\n· 다른 방식도 필요할 때: ${p.caution}\n· 세종에게서 배우기: ${p.sejong} (${p.src})\n· 내일부터 바꿀 말 한마디: ${p.say}\n`});
  s+='\n교육용 자기성찰 활동이며 검증된 심리검사가 아닙니다.\nhttps://sejong-book.vercel.app/sejong';
  return s;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
async function copyText(){
  const txt=resultText();
  try{await navigator.clipboard.writeText(txt);toast('결과 텍스트를 복사했어요');return}catch(e){}
  const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  ta.remove();toast(ok?'결과 텍스트를 복사했어요':'복사가 안 되면 화면을 캡처해 주세요');
}

async function makeImage(){
  try{await document.fonts.ready}catch(e){}
  const c=document.getElementById('cv'),x=c.getContext('2d');
  const F='"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const W=1080,M=80,TW=W-M*2;
  const {scores,topTypes,mixed}=res;
  function lines(text,font,max){x.font=font;const out=[];let line='';for(const ch of text){if(x.measureText(line+ch).width>max&&line){out.push(line);line=ch.trim()?ch:''}else line+=ch}if(line)out.push(line);return out}
  // layout pass then draw pass
  function paint(draw){
    let y=90;
    const T=(txt,font,color,lh,max=TW)=>{const ls=lines(txt,font,max);if(draw){x.fillStyle=color;x.font=font;ls.forEach((l,i)=>x.fillText(l,M,y+i*lh))}y+=ls.length*lh;};
    if(draw){x.fillStyle='#FAF8F3';x.fillRect(0,0,W,c.height);x.fillStyle='#8F2525';x.fillRect(0,0,W,16);x.textBaseline='top'}
    T('세종이라면, 나는 어떤 리더일까?',`700 32px ${F}`,'#8F2525',44);y+=26;
    if(mixed){T(who+'님에게는 두 가지 이상의 익숙한 방식이 있습니다',`700 40px ${F}`,'#202020',56);y+=8;T(topTypes.map(t=>P[t].name).join(' · '),`800 54px ${F}`,'#8F2525',72)}
    else{T(who+'님의 익숙한 리더십 방식은',`700 40px ${F}`,'#202020',56);y+=8;T(P[topTypes[0]].name,`800 76px ${F}`,'#8F2525',96)}
    y+=30;
    T('10문항 중 각 방식을 고른 횟수 (순위가 아니에요)',`600 26px ${F}`,'#666666',38);y+=12;
    TYPES.forEach(t=>{const on=topTypes.includes(t);
      if(draw){x.fillStyle=on?'#8F2525':'#333333';x.font=`${on?700:500} 28px ${F}`;x.fillText(P[t].name,M,y);
        const bx=M+340,bwid=TW-340-90;x.fillStyle='#EFE9E0';x.fillRect(bx,y+9,bwid,18);x.fillStyle=on?'#8F2525':'#BFB3A8';x.fillRect(bx,y+9,bwid*scores[t]/N,18);
        x.textAlign='right';x.fillStyle=on?'#8F2525':'#666666';x.fillText(scores[t]+'번',M+TW,y);x.textAlign='left'}
      y+=50;});
    y+=24;
    topTypes.forEach(t=>{const p=P[t];
      if(draw){x.fillStyle='#E6E0D6';x.fillRect(M,y,TW,2)}y+=34;
      T(p.headline,`800 44px ${F}`,'#202020',60);y+=14;
      T(p.strength,`400 30px ${F}`,'#333333',46);y+=22;
      T('내일부터 바꿀 말 한마디',`700 28px ${F}`,'#8F2525',42);y+=6;
      T(p.say,`700 34px ${F}`,'#202020',50);y+=34;
    });
    y+=10;T('교육용 자기성찰 활동 · sejong-book.vercel.app/sejong',`400 24px ${F}`,'#999999',36);
    return y+60;
  }
  c.height=Math.max(1080,Math.ceil(paint(false)));
  paint(true);
  let url;try{url=c.toDataURL('image/png')}catch(e){url=null}
  const area=document.getElementById('imageArea');
  if(!url){area.innerHTML='<p class="small">이 브라우저에서는 이미지 저장이 어려워요. 화면을 캡처하거나 텍스트 복사를 이용해 주세요.</p>';return}
  const fname=who.replace(/[\\/:*?"<>|]/g,'')+'_세종리더십_'+topTypes.map(t=>P[t].name.replace(/\s/g,'')).join('_')+'.png';
  area.innerHTML=`<img alt="저장할 결과 이미지" src="${url}"><a class="btn" style="text-align:center;text-decoration:none" download="${esc(fname)}" href="${url}">PNG로 저장하기 ↓</a><p class="small">휴대폰에서는 이미지를 길게 눌러 저장할 수도 있어요.<br>저장이 안 되면 화면을 캡처해 주세요.</p>`;
  area.scrollIntoView({behavior:'smooth',block:'start'});
}

intro();
</script>

</html>
